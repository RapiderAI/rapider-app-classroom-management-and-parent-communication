<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Classroom Management &amp; Parent Communication</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/classroom-pulse/classroom-pulse.html"></iframe>
  <script>
    const routes = {
  "classroom-pulse": "pages/classroom-pulse/classroom-pulse.html",
  "portfolio-moderation": "pages/portfolio-moderation/portfolio-moderation.html",
  "behavior-ledger": "pages/behavior-ledger/behavior-ledger.html",
  "stories-broadcasts": "pages/stories-broadcasts/stories-broadcasts.html",
  "family-messages": "pages/family-messages/family-messages.html",
  "slips-conferences": "pages/slips-conferences/slips-conferences.html",
  "engagement-analytics": "pages/engagement-analytics/engagement-analytics.html",
  "rubrics-templates": "pages/rubrics-templates/rubrics-templates.html",
  "comm-safety-policies": "pages/comm-safety-policies/comm-safety-policies.html",
  "student-engagement-detail": "pages/student-engagement-detail/student-engagement-detail.html",
  "permission-slip-detail": "pages/permission-slip-detail/permission-slip-detail.html",
  "broadcast-slip-drawer": "pages/broadcast-slip-drawer/broadcast-slip-drawer.html",
  "portfolio-conference-drawer": "pages/portfolio-conference-drawer/portfolio-conference-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'classroom-pulse';
      const target = routes[route] || routes['classroom-pulse'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
